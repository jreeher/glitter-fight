<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcefff"/>
      <stop offset="100%" stop-color="#ffe9f5"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#sky2)"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="30" cy="30" r="2"/>
    <circle cx="170" cy="24" r="1.6"/>
    <circle cx="150" cy="46" r="2.2"/>
    <circle cx="20" cy="70" r="1.6"/>
  </g>

  <!-- rainbow bridge arc -->
  <g fill="none" stroke-linecap="round">
    <path d="M20,175 Q100,25 178,112" stroke="#c44dff" stroke-width="10"/>
    <path d="M24,168 Q100,36 174,110" stroke="#4da6ff" stroke-width="10"/>
    <path d="M28,161 Q100,47 170,108" stroke="#4ddba0" stroke-width="10"/>
    <path d="M32,154 Q100,58 166,106" stroke="#f5e142" stroke-width="10"/>
    <path d="M36,147 Q100,69 162,104" stroke="#ff9f40" stroke-width="10"/>
    <path d="M40,140 Q100,80 158,102" stroke="#ff5c5c" stroke-width="10"/>
  </g>

  <!-- foreground cloud (path side) -->
  <g fill="#ffffff">
    <ellipse cx="30" cy="182" rx="34" ry="15"/>
    <ellipse cx="10" cy="176" rx="20" ry="11"/>
  </g>

  <!-- castle-side cloud -->
  <g fill="#ffffff">
    <ellipse cx="165" cy="124" rx="34" ry="14"/>
    <ellipse cx="188" cy="118" rx="18" ry="10"/>
  </g>

  <!-- small castle silhouette at the far end -->
  <g stroke="#c9d6ea" stroke-width="1.5">
    <rect x="132" y="90" width="16" height="28" fill="#f5f6ff"/>
    <polygon points="132,90 148,90 140,72" fill="url(#roof)" stroke="none"/>
    <rect x="154" y="70" width="24" height="48" fill="#f5f6ff"/>
    <polygon points="154,70 178,70 166,46" fill="url(#roof)" stroke="none"/>
    <rect x="182" y="90" width="16" height="28" fill="#f5f6ff"/>
    <polygon points="182,90 198,90 190,72" fill="url(#roof)" stroke="none"/>
    <rect x="162" y="100" width="8" height="18" rx="4" fill="#2a3550" stroke="none"/>
  </g>
  <polygon points="166,46 172,40 172,50" fill="#ff8fd6" stroke="none"/>
</svg>
